server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Universal Links / App Links: must be JSON, no redirect
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    # Deep-link paths: if the app is not installed, show the "open in app" page
    location ~ ^/(register|reset-password|auth/reset-password|invitations|accept-invitation) {
        try_files /open.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
